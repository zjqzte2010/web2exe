[package]
name = "exeify"
version = "0.2.1"
edition = "2021"
description = "把网址或本地 HTML 项目一键打包成 Windows exe（零工具链、秒级出包）"
license = "Apache-2.0"
authors = ["不坑老师", "zjqzte2010"]
repository = "https://github.com/zjqzte2010/web2exe"

[[bin]]
name = "exeify"
path = "src/main.rs"

[dependencies]
wry = "0.56"
tao = "0.34"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
mime_guess = "2"
anyhow = "1"
# 运行时改产物 exe 图标（不启用 images 特性，避免拉入重量级 image crate）
editpe = { version = "0.2", default-features = false, features = ["std"] }
# 把用户的 PNG 转成 ICO（.ico 直接用）
ico = "0.3"
# 自己解码 PNG（支持索引/灰度/RGB/RGBA 全类型），已是 ico 的传递依赖
png = "0.17"
# APK 输出：Zip64 支持 + v2 签名
sha2 = "0.10"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2", "pem"] }

[build-dependencies]
# 把 exeify.exe 自身的图标编进 PE
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
